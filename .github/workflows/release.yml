name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            signingSecret: WINDOWS_CSC_LINK
            signingPasswordSecret: WINDOWS_CSC_KEY_PASSWORD
          - os: macos-15
            command: npm run dist:mac
            artifact: macos-arm64
            signingSecret: MACOS_CSC_LINK
            signingPasswordSecret: MACOS_CSC_KEY_PASSWORD
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: macos-x64
            signingSecret: MACOS_CSC_LINK
            signingPasswordSecret: MACOS_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets[matrix.signingSecret] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.signingPasswordSecret] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "iCloud Email Manager $TAG" \
            --generate-notes \
            --verify-tag
