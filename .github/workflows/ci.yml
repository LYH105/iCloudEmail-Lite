name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.label }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            node: 22
          - label: macOS arm64
            os: macos-15
            node: 24
          - label: macOS x64
            os: macos-15-intel
            node: 22
          - label: Windows x64
            os: windows-latest
            node: 22
          - label: Windows x64
            os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check
      - run: npm run prepare:runtime --workspace @icloud-hme/desktop
      - run: npm run verify:runtime --workspace @icloud-hme/desktop
      - run: npm run doctor
